<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fragile Network</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0e0e11; font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
#canvas { display: block; background: #0e0e11; }
.overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #e8e9ee; font-size: 22px; letter-spacing: 0.4px; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; text-shadow: 0 6px 30px rgba(0,0,0,0.35); text-align: center; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="statusText" class="overlay">Stability compromised.</div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script>
const { Engine, Render, Runner, Bodies, Body, Composite, Constraint, Mouse, MouseConstraint, Events, Vector } = Matter;
const canvas = document.getElementById('canvas');
const statusText = document.getElementById('statusText');
let width = window.innerWidth, height = window.innerHeight;
const engine = Engine.create({ gravity: { x: 0, y: 0.25 }, enableSleeping: false });
const render = Render.create({ canvas, engine, options: { width, height, background: '#0e0e11', wireframes: false, pixelRatio: window.devicePixelRatio || 1 } });
Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);
const world = engine.world;
const cardSize = { w: 220, h: 110 };
const nodes = [
  { label: 'ABOUT', pos: () => ({ x: width/2 - 240, y: height/2 - 140 }), mass: 1.1, damping: 0.02, restitution: 0.08 },
  { label: 'PROJECTS', pos: () => ({ x: width/2 + 200, y: height/2 - 60 }), mass: 3.5, damping: 0.04, restitution: 0.05 },
  { label: 'CONTACT', pos: () => ({ x: width/2 - 40, y: height/2 + 190 }), mass: 1.0, damping: 0.025, restitution: 0.08 },
  { label: 'SETTINGS', pos: () => ({ x: width/2 + 60, y: height/2 + 40 }), mass: 2.2, damping: 0.1, restitution: 0.04 },
  { label: 'STATUS', pos: () => ({ x: width/2 - 160, y: height/2 + 40 }), mass: 0.7, damping: 0.02, restitution: 0.1 }
];
const bodies = nodes.map((n, i) => {
  const p = n.pos();
  const b = Bodies.rectangle(p.x, p.y, cardSize.w, cardSize.h, { chamfer: { radius: 16 }, mass: n.mass, frictionAir: n.damping, restitution: n.restitution, render: { visible: false } });
  b.cardLabel = n.label;
  b.personality = n.label.toLowerCase();
  return b;
});
Composite.add(world, bodies);
const connectionDefs = [
  [0,1],[1,3],[3,2],[2,4],[4,0],[0,3],[1,2]
];
let fatigueMemory = {};
let constraints = [];
function baseLen(a,b){ return Vector.magnitude(Vector.sub(a.position,b.position)); }
function makeConstraint(aIndex,bIndex,weaken=1){
  const a = bodies[aIndex], b = bodies[bIndex];
  const length = baseLen(a,b);
  const personalityFactor = {
    about: { stiffness:0.012, damping:0.08, slack:1.25 },
    projects: { stiffness:0.035, damping:0.12, slack:1.2 },
    contact: { stiffness:0.018, damping:0.06, slack:1.1 },
    settings: { stiffness:0.024, damping:0.14, slack:1.18 },
    status: { stiffness:0.01, damping:0.04, slack:1.35 }
  };
  const key = `${aIndex}-${bIndex}`;
  const fatigue = fatigueMemory[key] || 1;
  const slack = Math.min(personalityFactor[a.personality]?.slack || 1.2, personalityFactor[b.personality]?.slack || 1.2) * weaken * fatigue;
  const stiffness = ((personalityFactor[a.personality]?.stiffness || 0.02) + (personalityFactor[b.personality]?.stiffness || 0.02)) / 2;
  const damping = ((personalityFactor[a.personality]?.damping || 0.08) + (personalityFactor[b.personality]?.damping || 0.08)) / 2;
  const c = Constraint.create({ bodyA:a, bodyB:b, length, stiffness, damping, render:{ visible:false } });
  c.restLength = length;
  c.maxLength = length * slack;
  c.key = key;
  c.weaken = weaken;
  c.vibration = 0;
  constraints.push(c);
  Composite.add(world,c);
}
connectionDefs.forEach(([a,b])=> makeConstraint(a,b));
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, { mouse, constraint: { stiffness: 0.2, damping: 0.25, render: { visible:false } } });
Composite.add(world, mouseConstraint);
render.mouse = mouse;
let draggingBody = null;
Events.on(mouseConstraint, 'startdrag', e => { draggingBody = e.body; });
Events.on(mouseConstraint, 'enddrag', () => { draggingBody = null; });
let debris = [];
function fracture(c){
  const a = c.bodyA.position, b = c.bodyB.position;
  const pieces = 12;
  for(let i=0;i<pieces;i++){
    const t=i/pieces; const pos={ x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t };
    const vel={ x:(Math.random()-0.5)*2, y:(Math.random()-0.5)*2-1.2 };
    debris.push({ pos, vel, life:1, color:`rgba(255,${180+i*3},${120+i*2},1)` });
  }
}
function drawCard(body){
  const ctx = render.context;
  const { position, angle } = body;
  ctx.save();
  ctx.translate(position.x, position.y);
  ctx.rotate(angle);
  ctx.shadowColor='rgba(0,0,0,0.35)';
  ctx.shadowBlur=18;
  ctx.shadowOffsetY=6;
  const w=cardSize.w, h=cardSize.h, r=16;
  ctx.fillStyle='#e3e6eb';
  ctx.beginPath();
  ctx.moveTo(-w/2+r,-h/2);
  ctx.lineTo(w/2-r,-h/2);
  ctx.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  ctx.lineTo(w/2,h/2-r);
  ctx.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  ctx.lineTo(-w/2+r,h/2);
  ctx.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  ctx.lineTo(-w/2,-h/2+r);
  ctx.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#0f1117';
  ctx.font='700 20px "Inter", "Segoe UI", system-ui';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(body.cardLabel,0,0);
  ctx.restore();
}
function drawDebris(){
  const ctx = render.context;
  debris = debris.filter(d=>d.life>0);
  debris.forEach(d=>{
    d.vel.y += 0.18; d.vel.x *= 0.995;
    d.pos.x += d.vel.x; d.pos.y += d.vel.y;
    d.life -= 0.02;
    ctx.save();
    ctx.strokeStyle = d.color.replace('1)', `${d.life})`);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(d.pos.x, d.pos.y);
    ctx.lineTo(d.pos.x + d.vel.x*2, d.pos.y + d.vel.y*0.6);
    ctx.stroke();
    ctx.restore();
  });
}
function drawConstraints(){
  const ctx = render.context;
  constraints.forEach(c=>{
    if(!c.bodyA||!c.bodyB) return;
    const a=c.bodyA.position, b=c.bodyB.position;
    const dist = Vector.magnitude(Vector.sub(a,b));
    const tension = Math.max(0, dist - c.restLength);
    const ratio = Math.min(1.5, dist / c.maxLength);
    c.vibration = c.vibration*0.85 + (ratio>0.9 ? 1.2 : 0.3)*ratio;
    const hue = 210 - Math.min(80, (dist/c.restLength-1)*120);
    const alpha = 0.35 + Math.min(0.5, tension/ (c.maxLength*0.8));
    const jitter = (Math.random()-0.5)*c.vibration*2;
    const mid = { x:(a.x+b.x)/2 + jitter, y:(a.y+b.y)/2 - jitter };
    ctx.save();
    ctx.strokeStyle = `hsla(${hue},85%,65%,${alpha})`;
    ctx.lineWidth = 2 + (ratio>1? (ratio-1)*5: ratio*1.2);
    ctx.shadowBlur = 12;
    ctx.shadowColor = `hsla(${hue},95%,70%,${alpha})`;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(mid.x, mid.y, b.x,b.y);
    ctx.stroke();
    ctx.restore();
  });
  drawDebris();
}
let stabilityState = 'STABLE';
let stabilityValue = 1;
function updateStability(agg){
  const intactRatio = constraints.length / (connectionDefs.length + rebuiltCount);
  const tensionSum = constraints.reduce((s,c)=>{ const d=Vector.magnitude(Vector.sub(c.bodyA.position,c.bodyB.position)); return s + Math.max(0,d-c.restLength); },0);
  stabilityValue = Math.max(0, Math.min(1, intactRatio*0.6 + Math.exp(-tensionSum*0.002)*0.4 - agg*0.15));
  if(stabilityValue>0.7) stabilityState='STABLE';
  else if(stabilityValue>0.45) stabilityState='STRAINED';
  else if(stabilityValue>0.2) stabilityState='UNSTABLE';
  else stabilityState='COLLAPSE';
  statusText.style.opacity = stabilityState==='UNSTABLE' || stabilityState==='COLLAPSE' ? 1 : 0;
  if(stabilityState==='STRAINED') engine.gravity.y = 0.35;
  else if(stabilityState==='UNSTABLE') engine.gravity.y = 0.55;
  else if(stabilityState==='COLLAPSE') engine.gravity.y = 0.7;
  else engine.gravity.y = 0.25;
}
let rebuiltCount = 0;
function checkSprings(){
  for(let i=constraints.length-1;i>=0;i--){
    const c=constraints[i];
    if(!c.bodyA||!c.bodyB) { constraints.splice(i,1); continue; }
    const dist = Vector.magnitude(Vector.sub(c.bodyA.position,c.bodyB.position));
    if(!draggingBody) continue;
    if(dist > c.maxLength){
      fracture(c);
      fatigueMemory[c.key] = (fatigueMemory[c.key]||1)*0.94;
      Composite.remove(world,c);
      constraints.splice(i,1);
    }
  }
}
function applyDragResistance(){
  if(!draggingBody) return;
  const linked = constraints.filter(c=>c.bodyA===draggingBody||c.bodyB===draggingBody);
  linked.forEach(c=>{
    const other = c.bodyA===draggingBody?c.bodyB:c.bodyA;
    const dist = Vector.magnitude(Vector.sub(draggingBody.position, other.position));
    const over = Math.max(0, dist - c.restLength);
    if(over>0){
      const dir = Vector.normalise(Vector.sub(draggingBody.position, other.position));
      const resistance = over * 0.0006;
      Body.applyForce(draggingBody, draggingBody.position, Vector.mult(dir, -resistance));
    }
  });
}
let repairTracker = {};
function tryRepair(){
  for(let i=0;i<bodies.length;i++){
    for(let j=i+1;j<bodies.length;j++){
      const key=`${i}-${j}`;
      if(constraints.find(c=>c.key===key)) continue;
      const dist = Vector.magnitude(Vector.sub(bodies[i].position,bodies[j].position));
      const relVel = Vector.magnitude(Vector.sub(bodies[i].velocity,bodies[j].velocity));
      if(dist<140 && relVel<0.6){
        repairTracker[key] = (repairTracker[key]||0) + 1;
        if(repairTracker[key]>50){
          fatigueMemory[key] = (fatigueMemory[key]||1)*0.92;
          makeConstraint(i,j,0.92);
          rebuiltCount++;
          repairTracker[key]=0;
        }
      } else {
        repairTracker[key]=0;
      }
    }
  }
}
Events.on(engine,'beforeUpdate', ()=>{
  applyDragResistance();
  checkSprings();
});
Events.on(engine,'afterUpdate', ()=>{
  tryRepair();
  const aggression = draggingBody ? Math.min(1, Vector.magnitude(draggingBody.velocity)*0.02) : 0;
  updateStability(aggression);
});
Events.on(render,'afterRender', ()=>{
  drawConstraints();
  bodies.forEach(drawCard);
});
window.addEventListener('resize', ()=>{
  width=window.innerWidth; height=window.innerHeight;
  render.canvas.width=width; render.canvas.height=height;
  render.options.width=width; render.options.height=height;
  render.bounds.max.x=width; render.bounds.max.y=height;
});
</script>
</body>
</html>
