<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fragile Springs</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0e0e11; font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
#canvas { display: block; background: #0e0e11; }
.overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #e7e8ec; font-size: 42px; letter-spacing: 0.5px; opacity: 0; transition: opacity 1s ease; pointer-events: none; text-shadow: 0 10px 40px rgba(0,0,0,0.35); text-align: center; }
#rebuild { top: auto; bottom: 80px; font-size: 18px; opacity: 0; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="message" class="overlay">You broke it.</div>
<div id="rebuild" class="overlay">Hold to rebuild.</div>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
<script>
const { Engine, Render, Runner, Bodies, Body, Composite, Constraint, Mouse, MouseConstraint, Events, Vector } = Matter;
const canvas = document.getElementById('canvas');
const message = document.getElementById('message');
const rebuildHint = document.getElementById('rebuild');
let width = window.innerWidth;
let height = window.innerHeight;
const engine = Engine.create({ gravity: { x: 0, y: 0.25 } });
const render = Render.create({ canvas, engine, options: { width, height, background: '#0e0e11', wireframes: false, pixelRatio: window.devicePixelRatio || 1 } });
Render.run(render);
const runner = Runner.create();
Runner.run(runner, engine);
const world = engine.world;
const anchor = Bodies.circle(width / 2, height / 2, 6, { isStatic: true, render: { visible: false } });
Composite.add(world, anchor);
const cardSize = { w: 230, h: 116 };
const startPositions = [
  { label: 'ABOUT', pos: { x: width / 2 - 240, y: height / 2 - 140 }, type: 'about' },
  { label: 'PROJECTS', pos: { x: width / 2 + 70, y: height / 2 - 30 }, type: 'projects' },
  { label: 'CONTACT', pos: { x: width / 2 - 80, y: height / 2 + 190 }, type: 'contact' }
];
const memory = { fatigue: 1, wobble: 1 };
const cards = startPositions.map((card) => {
  const body = Bodies.rectangle(card.pos.x, card.pos.y, cardSize.w, cardSize.h, { chamfer: { radius: 18 }, mass: 2.2, frictionAir: 0.03, restitution: 0.08, render: { visible: false } });
  body.cardLabel = card.label;
  body.springType = card.type;
  body.basePos = { ...card.pos };
  return body;
});
Composite.add(world, cards);
const springConfigs = {
  about: { stiffness: 0.012, damping: 0.08, length: 80, max: () => 360 },
  projects: { stiffness: 0.04, damping: 0.12, length: 56, max: () => 300 },
  contact: { stiffness: 0.018, damping: 0.06, length: 44, max: () => 220 }
};
let constraints = [];
function addSpring(card) {
  const cfg = springConfigs[card.springType];
  const c = Constraint.create({ bodyA: anchor, bodyB: card, pointA: { x: 0, y: 0 }, pointB: { x: 0, y: 0 }, stiffness: cfg.stiffness * memory.fatigue, damping: cfg.damping, length: cfg.length, render: { visible: false } });
  c.metaType = card.springType;
  c.maxLength = cfg.max() * memory.fatigue;
  c.fray = 0;
  constraints.push(c);
  Composite.add(world, c);
}
cards.forEach(addSpring);
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, { mouse, constraint: { stiffness: 0.18, damping: 0.22, render: { visible: false } } });
Composite.add(world, mouseConstraint);
render.mouse = mouse;
let shakeTimer = 0;
let slowTimer = 0;
let collapsed = false;
let collapseStart = null;
let rebuildHold = false;
let rebuildProgress = 0;
let debris = [];
let imperfection = { x: 0, y: 0 };
let hesitating = false;
function triggerShake() { shakeTimer = 16; }
function triggerSlow() { slowTimer = 18; engine.timing.timeScale = 0.4; }
function startCollapse() {
  collapsed = true;
  collapseStart = performance.now();
  message.style.opacity = 1;
  rebuildHint.style.opacity = 1;
  cards.forEach((c) => Body.applyForce(c, c.position, { x: (Math.random() - 0.5) * 0.002, y: -0.003 }));
}
function startRebuild() { rebuildProgress = 0; rebuildHold = true; }
function stopRebuild() { rebuildHold = false; if (!collapsed) rebuildProgress = 0; }
function fracture(c) {
  const a = anchor.position;
  const b = c.bodyB.position;
  const pieces = 10;
  for (let i = 0; i < pieces; i++) {
    const t = i / pieces;
    const pos = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    const vel = { x: (Math.random() - 0.5) * 3, y: (Math.random() - 0.5) * 3 - 2 };
    debris.push({ pos, vel, life: 1, color: `rgba(255, ${180 + i * 6}, ${150 + i * 4}, 1)` });
  }
}
function drawCard(body) {
  const ctx = render.context;
  const { position, angle } = body;
  ctx.save();
  ctx.translate(position.x, position.y);
  ctx.rotate(angle);
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 18 * memory.wobble;
  ctx.shadowOffsetY = 6;
  const w = cardSize.w, h = cardSize.h, r = 18;
  ctx.fillStyle = '#e3e6eb';
  ctx.beginPath();
  ctx.moveTo(-w/2 + r, -h/2);
  ctx.lineTo(w/2 - r, -h/2);
  ctx.quadraticCurveTo(w/2, -h/2, w/2, -h/2 + r);
  ctx.lineTo(w/2, h/2 - r);
  ctx.quadraticCurveTo(w/2, h/2, w/2 - r, h/2);
  ctx.lineTo(-w/2 + r, h/2);
  ctx.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r);
  ctx.lineTo(-w/2, -h/2 + r);
  ctx.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0f1117';
  ctx.font = '700 20px "Inter", "Segoe UI", system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(body.cardLabel, 0, 0);
  ctx.restore();
}
function drawDebris() {
  const ctx = render.context;
  debris = debris.filter(d => d.life > 0);
  debris.forEach(d => {
    d.vel.y += 0.18;
    d.vel.x *= 0.99;
    d.pos.x += d.vel.x;
    d.pos.y += d.vel.y;
    d.life -= 0.02;
    ctx.save();
    ctx.strokeStyle = d.color.replace('1)', `${d.life})`);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(d.pos.x, d.pos.y);
    ctx.lineTo(d.pos.x + d.vel.x * 1.5, d.pos.y + d.vel.y * 0.4);
    ctx.stroke();
    ctx.restore();
  });
}
function drawConstraints() {
  const ctx = render.context;
  constraints.forEach((c) => {
    if (!c || !c.bodyB) return;
    const a = anchor.position;
    const b = c.bodyB.position;
    const dist = Vector.magnitude(Vector.sub(b, a));
    const ratio = Math.min(1.5, dist / c.maxLength);
    const tension = Math.max(0, ratio - 0.7);
    const hue = 200 - tension * 120;
    const alpha = 0.45 + tension * 0.4;
    const flicker = Math.sin(engine.timing.timestamp * 0.02 + dist * 0.03) * tension * 3;
    const wobble = Math.sin(engine.timing.timestamp * 0.09 + dist * 0.02) * 4 * tension;
    const mid = { x: (a.x + b.x) / 2 + wobble, y: (a.y + b.y) / 2 + flicker };
    ctx.save();
    ctx.strokeStyle = `hsla(${hue}, 85%, ${65 - tension * 25}%, ${alpha})`;
    ctx.lineWidth = 2 + tension * 3;
    ctx.shadowBlur = 14;
    ctx.shadowColor = `hsla(${hue}, 95%, 70%, ${alpha})`;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(mid.x, mid.y, b.x, b.y);
    ctx.stroke();
    ctx.restore();
  });
  drawDebris();
}
function updateSprings() {
  for (let i = constraints.length - 1; i >= 0; i--) {
    const c = constraints[i];
    if (!c || !c.bodyB) { constraints.splice(i, 1); continue; }
    const dist = Vector.magnitude(Vector.sub(c.bodyB.position, anchor.position));
    const vMag = Vector.magnitude(c.bodyB.velocity);
    hesitating = mouse.button === -1 && vMag < 0.6;
    const aggression = Math.min(0.45, Math.max(0, (vMag - (hesitating ? 1.6 : 1)) * 0.015));
    const effective = dist * (1 + aggression);
    if (effective > c.maxLength) {
      fracture(c);
      Composite.remove(world, c);
      constraints.splice(i, 1);
      triggerShake();
      triggerSlow();
    }
  }
  if (!collapsed && constraints.length === 0) startCollapse();
}
function updateShake() {
  if (shakeTimer > 0) {
    const intensity = shakeTimer / 16;
    const dx = (Math.random() - 0.5) * 12 * intensity;
    const dy = (Math.random() - 0.5) * 12 * intensity;
    render.canvas.style.transform = `translate(${dx}px, ${dy}px)`;
    shakeTimer -= 1;
  } else {
    render.canvas.style.transform = 'translate(0,0)';
  }
}
function updateSlowMo() {
  if (slowTimer > 0) { slowTimer--; if (slowTimer === 0) engine.timing.timeScale = 1; }
}
function updateCollapse() {
  if (!collapsed) return;
  const elapsed = (performance.now() - collapseStart) / 1000;
  const target = Math.min(3, 0.6 + elapsed * 1.2);
  engine.gravity.y = target;
}
function updateRebuild() {
  if (!collapsed) return;
  if (rebuildHold) {
    rebuildProgress = Math.min(1, rebuildProgress + 0.015);
  } else if (rebuildProgress > 0) {
    rebuildProgress = Math.max(0, rebuildProgress - 0.02);
  }
  if (rebuildProgress > 0) {
    engine.timing.timeScale = 1;
    engine.gravity.y = Math.max(0, engine.gravity.y - 0.15);
    cards.forEach((c) => {
      const target = { x: c.basePos.x + imperfection.x, y: c.basePos.y + imperfection.y };
      const back = Vector.sub(target, c.position);
      Body.setVelocity(c, { x: back.x * 0.04 * rebuildProgress, y: back.y * 0.06 * rebuildProgress });
      Body.setAngularVelocity(c, Body.getAngularVelocity(c) * 0.8);
    });
    debris.forEach(d => { d.pos.x -= d.vel.x * 0.35; d.pos.y -= d.vel.y * 0.35; d.life -= 0.01; });
    if (rebuildProgress === 1 && constraints.length < cards.length) {
      imperfection = { x: (Math.random() - 0.5) * 12 * memory.wobble, y: (Math.random() - 0.5) * 12 * memory.wobble };
      cards.forEach((c) => { if (!constraints.find(k => k.bodyB === c)) addSpring(c); });
      collapsed = false;
      message.style.opacity = 0;
      rebuildHint.style.opacity = 0;
      memory.fatigue *= 0.88;
      memory.wobble *= 1.1;
      engine.gravity.y = 0.25;
    }
  }
}
Events.on(engine, 'afterUpdate', () => {
  updateSprings();
  updateCollapse();
  updateRebuild();
});
Events.on(render, 'afterRender', () => {
  drawConstraints();
  cards.forEach(drawCard);
  updateShake();
  updateSlowMo();
});
window.addEventListener('resize', () => {
  width = window.innerWidth; height = window.innerHeight;
  render.canvas.width = width; render.canvas.height = height;
  render.options.width = width; render.options.height = height;
  render.bounds.max.x = width; render.bounds.max.y = height;
  Body.setPosition(anchor, { x: width / 2, y: height / 2 });
});
window.addEventListener('mousedown', () => { if (collapsed) startRebuild(); });
window.addEventListener('mouseup', stopRebuild);
</script>
</body>
</html>
